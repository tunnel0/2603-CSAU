<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitor - R1 & R2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-up: #22c55e;
            --accent-down: #ef4444;
            --accent-primary: #3b82f6;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(34, 197, 94, 0.1) 0, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 3rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #3b82f6, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        main {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .router-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .router-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.4);
        }

        .router-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .router-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-primary);
        }

        .router-ip {
            font-family: monospace;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .interface-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .interface-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid var(--glass-border);
        }

        .if-info {
            display: flex;
            flex-direction: column;
        }

        .if-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .if-last-change {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .status-pill {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-up {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--accent-up);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-down {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-down);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-error {
            background-color: rgba(148, 163, 184, 0.15);
            color: var(--text-secondary);
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        @media (max-width: 640px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Real-Time Interface Monitor</h1>
        <p>RESTCONF Operational Status for R1 & R2</p>
    </header>

    <main id="monitor-content">
        <!-- Dashboard cards will be injected here -->
        <p style="text-align: center; grid-column: 1/-1;">Loading status...</p>
    </main>

    <footer>
        Actualización automática cada 5 segundos
    </footer>

    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                renderMonitor(data);
            } catch (error) {
                console.error("Error fetching status:", error);
            }
        }

        function renderMonitor(routers) {
            const container = document.getElementById('monitor-content');
            if (routers.length === 0) {
                container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">Esperando datos del monitor...</p>';
                return;
            }

            container.innerHTML = routers.map(router => `
                <div class="router-card">
                    <div class="router-header">
                        <span class="router-name">${router.hostname}</span>
                        <span class="router-ip">${router.ip}</span>
                    </div>
                    <div class="interface-list">
                        ${router.interfaces.map(iface => {
                            const isError = !!iface.error;
                            const isUp = iface.oper_status === 'if-oper-state-ready' || iface.oper_status === 'up';
                            const statusLabel = isError ? 'Error' : (isUp ? 'UP' : 'DOWN');
                            const statusClass = isError ? 'status-error' : (isUp ? 'status-up' : 'status-down');
                            
                            return `
                                <div class="interface-item">
                                    <div class="if-info">
                                        <span class="if-name">${iface.name}</span>
                                        <span class="if-last-change">${isError ? iface.error : 'Last Up: ' + iface.last_change}</span>
                                    </div>
                                    <span class="status-pill ${statusClass}">${statusLabel}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        // Initial fetch
        fetchStatus();
        // Poll every 5 seconds
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
